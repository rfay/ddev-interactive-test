name: ddev-interactive-test

pre_install_actions:
  - |
    #ddev-description: Configure interactive test value
    #ddev-interactive
    rm -f ~/tmp/preinstall-interactive-test.txt
    read -p "Enter test value for preinstall-interactive-test.txt: " VALUE
    echo "VALUE=${VALUE}" > preinstall-interactive-test.txt
    echo "Wrote preinstall-interactive-test.txt"
    test -f preinstall-interactive-test.txt && cat preinstall-interactive-test.txt
    realpath preinstall-interative-test.txt
post_install_actions:
  - |
    #ddev-description: Configure interactive test value
    #ddev-interactive
    rm -f postinstall-interactive-test.txt
    read -p "Enter test value for post-install-interactive-test.txt: " VALUE
    echo "VALUE=${VALUE}" > postinstall-interactive-test.txt
    echo "Wrote postinstall-interactive-test.txt"
    test -f postinstallinstall-interactive-test.txt && cat postinstall-interactive-test.txt
    realpath postinstall-interative-test.txt
